<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1A1D3B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FinTrack – Indian Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { background: #F0F4FF; font-family: 'Nunito', sans-serif; }
      /* Loading spinner */
      #splash {
        position: fixed; inset: 0;
        background: linear-gradient(180deg, #1A1D3B 0%, #0C0E1A 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; transition: opacity .4s;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash-icon { font-size: 60px; margin-bottom: 16px; animation: pulse 1.5s infinite; }
      #splash-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 800; color: #fff; }
      #splash-title span { color: #F5A623; }
      #splash-sub { font-size: 13px; color: rgba(255,255,255,0.4); font-weight: 600; margin-top: 8px; font-family: 'Nunito', sans-serif; }
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    </style>
  </head>
  <body>
    <!-- Splash screen shown while React loads -->
    <div id="splash">
      <div id="splash-icon">💰</div>
      <div id="splash-title">Fin<span>Track</span></div>
      <div id="splash-sub">Indian Personal Finance</div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide splash when React mounts
      window.__hideSplash = () => {
        const s = document.getElementById('splash');
        if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 500); }
      };
    </script>
  </body>
</html>
